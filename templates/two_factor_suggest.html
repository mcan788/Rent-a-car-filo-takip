<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hesap Güvenliğinizi Artırın - ZYRONOVA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            background: #f8fafc;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            margin: 0;
        }
        .suggest-card {
            background: white;
            padding: 3rem;
            border-radius: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        .shield-icon {
            width: 80px;
            height: 80px;
            background: #eff6ff;
            color: #2563eb;
            border-radius: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 2rem;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.1);
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 2.5rem;
        }
        .btn-now {
            background: #2563eb;
            color: white;
            padding: 1.25rem;
            border-radius: 1rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }
        .btn-now:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
        }
        .btn-later {
            background: #f8fafc;
            color: #64748b;
            padding: 1rem;
            border-radius: 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            border: 1px solid #e2e8f0;
        }
        .btn-later:hover {
            background: #f1f5f9;
            color: #1e293b;
        }
    </style>
</head>
<body>
    <div class="suggest-card">
        <div class="shield-icon">
            <i class="fas fa-user-shield"></i>
        </div>
        <h1 style="font-size: 1.75rem; font-weight: 800; color: #0f172a; margin-bottom: 1rem;">Hesabınızı Zırhlandırın!</h1>
        <p style="color: #64748b; line-height: 1.6; font-size: 1.05rem;">
            Hesabınız şu an sadece şifre ile korunuyor. İki Faktörlü Doğrulama (2FA) ekleyerek, şifreniz çalınsa bile verilerinizi güvende tutabilirsiniz.
        </p>
        
        <div class="btn-group">
            <a href="{{ url_for('auth.two_factor_setup') }}" class="btn-now">
                <i class="fas fa-check-circle"></i> Hemen Kurulumu Yap
            </a>
            <a href="{{ url_for('auth.two_factor_skip') }}" class="btn-later">
                Şimdilik Geç (Önerilmez)
            </a>
        </div>
        
        <p style="margin-top: 2rem; font-size: 0.8rem; color: #94a3b8;">
            * İstediğiniz zaman profil ayarlarından kapatabilirsiniz.
        </p>
    </div>
</body>
</html>
