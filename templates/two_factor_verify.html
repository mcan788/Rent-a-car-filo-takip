<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Doğrulama - ZYRONOVA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            background: #f8fafc;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }
        .verify-card {
            background: white;
            padding: 2.5rem;
            border-radius: 2rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .icon-box {
            width: 60px;
            height: 60px;
            background: #eff6ff;
            color: #2563eb;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin: 0 auto 1.5rem;
        }
        .code-input {
            width: 100%;
            height: 60px;
            text-align: center;
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: 0.5rem;
            border: 2px solid #e2e8f0;
            border-radius: 1rem;
            margin-bottom: 1.5rem;
            transition: all 0.2s;
        }
        .code-input:focus {
            border-color: #2563eb;
            outline: none;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }
        .btn-verify {
            width: 100%;
            padding: 1rem;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-verify:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }
        .flash-messages {
            margin-bottom: 1rem;
        }
        .flash-error {
            background: #fef2f2;
            color: #dc2626;
            padding: 0.75rem;
            border-radius: 0.75rem;
            font-size: 0.85rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="verify-card">
        <div class="icon-box">
            <i class="fas fa-key"></i>
        </div>
        <h1 style="font-size: 1.25rem; font-weight: 800; color: #0f172a; margin-bottom: 0.5rem;">İki Adımlı Doğrulama</h1>
        <p style="font-size: 0.875rem; color: #64748b; margin-bottom: 2rem;">Lütfen telefonunuzdaki uygulamada görünen 6 haneli kodu girin.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="flash-messages">
              {% for category, message in messages %}
                <div class="flash-error">{{ message }}</div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="text" name="token" class="code-input" maxlength="6" placeholder="000000" autofocus required autocomplete="off">
            <button type="submit" class="btn-verify">Giriş Yap</button>
        </form>
        
        <a href="{{ url_for('auth.login') }}" style="display: block; margin-top: 1.5rem; font-size: 0.825rem; color: #64748b; text-decoration: none;">
            <i class="fas fa-arrow-left"></i> Giriş ekranına dön
        </a>
    </div>
</body>
</html>
